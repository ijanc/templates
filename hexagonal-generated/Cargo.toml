[workspace]
members = ["adapters/*", "apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["your name <author@example.com>"]
edition = "2024"
license = "ISC"
repository = "https://github.com/ijanc/hexagonal-generated"

[workspace.dependencies]
# Members go by their layer name in code, so no source file carries the
# project name.
application = { package = "hexagonal-generated-application", path = "crates/application" }
domain = { package = "hexagonal-generated-domain", path = "crates/domain" }
http_adapter = { package = "hexagonal-generated-http", path = "adapters/http" }
store_memory = { package = "hexagonal-generated-store-memory", path = "adapters/store-memory" }
store_sqlx = { package = "hexagonal-generated-store-sqlx", path = "adapters/store-sqlx" }
testkit = { package = "hexagonal-generated-testkit", path = "crates/testkit" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "typed-header",
] }
axum-prometheus = "0.10.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
governor = { version = "0.10.4", default-features = false }
listenfd = "1.0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
  "uuid",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = [
  "cors",
  "request-id",
  "timeout",
  "trace",
] }
tower_governor = { version = "0.8.0", default-features = false, features = [
  "axum",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.26.1", features = ["v4"] }
