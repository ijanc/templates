[template]
cargo_generate_version = ">=0.21.1"
ignore = ["Cargo.lock", "target"]

[hooks]
pre = ["hooks/pre.rhai"]

[placeholders]
project-description = { type = "string", prompt = "Short description", default = "REST API" }
gh-username = { type = "string", prompt = "GitHub username (repository URL, FUNDING.yml)" }
domain = { type = "string", prompt = "Domain for security/conduct contact emails", default = "example.org" }
store = { type = "string", prompt = "Storage backend", choices = ["memory", "sqlite", "postgres"], default = "memory" }

# The memory store is a map already; only the database stores get one.
[conditional.'store != "memory"'.placeholders]
cache = { type = "bool", prompt = "Cache reads in memory (moka)", default = false }
