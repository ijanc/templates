[package]
name = "{{project-name}}"
version = "0.1.0"
authors = ["{{authors}}"]
edition = "2024"
license = "ISC"
repository = "https://github.com/{{gh-username}}/{{project-name}}"
description = "{{project-description}}"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "typed-header",
] }
axum-prometheus = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
governor = { version = "0.10.4", default-features = false }
{%- if cache %}
moka = { version = "0.12.16", features = ["future"] }
{%- endif %}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
{%- if sqlx %}
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
{%- if store == "postgres" %}
  "postgres",
  "runtime-tokio",
  "tls-rustls",
{%- else %}
  "runtime-tokio",
  "sqlite",
{%- endif %}
  "uuid",
] }
{%- endif %}
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = [
  "cors",
  "request-id",
  "timeout",
  "trace",
] }
tower_governor = { version = "0.8.0", default-features = false, features = [
  "axum",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[lib]
name = "{{crate_name}}"
path = "src/lib.rs"

[[bin]]
doc = false
name = "{{project-name}}"
path = "src/main.rs"
