# daemon-generatedd.conf - see daemon-generatedd.conf(5)

# Control socket used by daemon-generatedctl(8). Must be absolute.
#socket = "/var/run/daemon-generatedd.sock"

# Run the engine process as this user.
# Requires starting daemon-generatedd as root.
#user = "_daemon_generated"

# Confine the engine to this directory. Must be owned by root and not
# writable by group or others. Default: the home directory of user.
#chroot = "/var/empty"

# Seconds between runs of the periodic task.
#interval = 60
