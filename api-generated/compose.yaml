services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      API_GENERATED_ADDR: 0.0.0.0:8080

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./contrib/prometheus.yml:/etc/prometheus/prometheus.yml:ro
