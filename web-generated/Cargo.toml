[package]
name = "web-generated"
version = "0.1.0"
authors = ["your name <author@example.com>"]
edition = "2024"
license = "ISC"
repository = "https://github.com/ijanc/web-generated"
description = "An example generated using the web template"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
minijinja = { version = "2.24.0", features = ["loader", "urlencode"] }
minijinja-autoreload = "2.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.8.6", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
  "uuid",
] }
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = [
  "fs",
  "request-id",
  "timeout",
  "trace",
] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = [
  "sqlite",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
  "cookies",
  "form",
  "json",
] }

[lib]
name = "web_generated"
path = "src/lib.rs"

[[bin]]
doc = false
name = "web-generated"
path = "src/main.rs"
