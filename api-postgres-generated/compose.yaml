services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      API_POSTGRES_GENERATED_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/api_postgres_generated
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_postgres_generated
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./contrib/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  pgdata:
